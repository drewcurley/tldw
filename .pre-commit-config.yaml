# Optional: pre-commit framework configuration (https://pre-commit.com).
# This is a TEMPLATE — most stanzas are commented out. Uncomment what your stack uses.
# tldw (T-003): not installed or used; tldw's checks run in CI via scripts/ci-tldw-tests.sh.
#
# This file is COMPLEMENTARY to .githooks/ (which is stack-neutral and always-on).
# .githooks/ enforces procedure (branch names, placeholders, secrets, Task IDs, consensus assertion).
# .pre-commit-config.yaml adds stack-specific quality (formatters, linters, type checkers).
#
# Install pre-commit:
#   pip install pre-commit            # or: brew install pre-commit
# Then enable it:
#   pre-commit install
#
# Revisions below are illustrative — bump to the latest releases when you adopt.

repos:
  # Always-on cross-stack basics
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=512']
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-case-conflict
      - id: detect-private-key

  # Strong secret scanning (replaces the basic regex in .githooks/pre-commit)
