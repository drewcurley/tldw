[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-tldw"
version = "1.3.0"
description = "Summarize a YouTube video into a text or video TL;DW."
requires-python = ">=3.11"
dependencies = ["pillow>=10.3,<12"]

[project.optional-dependencies]
dev = ["pytest>=8"]
tts = ["piper-tts>=1.2"]       # text-mode --render-audio (local neural voices)
whisper = ["faster-whisper>=1.0"]  # --whisper-fallback (captionless videos)

[project.scripts]
tldw = "youtube_tldw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# This project does its work in threads -- the HTTP handlers, the segment
# prefetch, the transcription job. An assertion that fires inside one of those
# only raises a warning, so a guard like `lambda: pytest.fail(...)` passed as a
# monkeypatched callable would be silently decorative. Four of them were.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]
